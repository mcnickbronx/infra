[defaults]
# Движок работает на самом сервере: инвентарь — этот сервер (infra передаёт его имя),
# подключение — local. Настройки и пароли сервера — /etc/infra (site.yml их читает)
roles_path = roles
collections_path = collections
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
# Отложенные перезапуски (handlers) выполняются, даже если прогон упал посередине.
# Иначе они теряются: файл настроек уже записан, следующий прогон его не меняет,
# и служба так и работает со старыми настройками (так Postgres на тестовой VDS
# остался слушать только 127.0.0.1).
force_handlers = True
# Модули не пишут каждый свой вызов в журнал сервера: прогон идёт службой infra-apply,
# и её журнал — это вывод прогона, без тысяч строк «Invoked with ...»
no_target_syslog = True

[connection]
# Задачи от имени postgres (become_user) — без временных файлов в /tmp
pipelining = True
