# Всё включено: каждая настройка, которая влияет на шаблоны.
restic_s3_repository_base: "s3:https://s3.fixture.test/backups"
backup_healthcheck_url: "https://hc.fixture.test/backup"
monitor_healthcheck_url: "https://hc.fixture.test/monitor"
access_link_host: access.fixture.test
access_link_hours: 12
dns_servers: [192.0.2.53, "2001:db8::53"]
watch_sites: ["https://shop.other.test/", "https://back.shop.other.test/api/health"]

docker_users: [dina]
projects:
  shop:
    domains: [shop.fixture.test, "*.shop.fixture.test"]
    net: 11
    db: postgres
    db_conn_limit: 100
    autodeploy: true              # участники проекта с автовыкладкой — только из docker_users
    image: ghcr.io/example/shop   # автовыкладка тянет только этот репозиторий
    backup_hourly: all
    memory: 4g
    cpus: 2
    devs: [dina]
  crm:
    net: 12
    db: postgres
    db_statement_timeout: "0"
    backup_hourly: db
    backup_every: 5               # таймер — с шагом 5 минут, shop (60) снимается в :05
    devs: [ivan, gone]
  blog:
    net: 13
    memory: 512m
    cpus: 0.5
    devs: [olga, vera]
  static:
    net: 20
    devs: [olga, kira]
  lab:
    net: 30
    db: postgres
    rootless: true                # без root: своя группа — свой пользователь и Docker
    autodeploy: true              # участникам проекта без root docker_users не нужен
    image: ghcr.io/example/lab
    devs: [kira]
  api_one:                        # группа back: один Docker без root на два проекта
    net: 31
    db: postgres
    rootless: back
    memory: 1g
    cpus: 1
    devs: [ivan]
  api_two:
    net: 32
    rootless: back
    memory: 512m
    cpus: 0.5
    devs: [olga]
