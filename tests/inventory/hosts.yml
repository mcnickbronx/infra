# Тестовый инвентарь: вымышленные серверы для проверок без настоящих серверов
# (tools/check.sh, CI). Умолчания движка — настоящие (tests/group_vars — ссылка на group_vars
# движка), server.yml каждого сервера — его host_vars, люди и пароли — вымышленные.
#
# fixture — сервер, где включено всё: шаблоны рендерятся в tests/golden/<сервер>/
#           и сравниваются с эталоном (tests/render.yml);
# invalid — по одной ошибке на сервер: проверки инвентаря должны её поймать
#           с сообщением из expect_error (tests/invalid.yml).
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    tested:           # общее для всех: group_vars/tested.yml
      children:
        fixture:
        invalid:
    fixture:
      hosts:
        full:           # всё включено: S3, уведомления, автовыкладка, лимиты, несколько проектов
    invalid:
      hosts:
        bad-net-dup:
        bad-project-name:
        bad-reserved-name:
        bad-reserved-pg-word:
        bad-db-type:
        bad-docker-user:
        bad-unknown-person:
        bad-person-is-project:
        bad-placeholder-key:
        bad-memory:
        bad-placeholder-url:
        bad-s3-keys:
        bad-autodeploy:
        bad-backup-hourly:
        bad-backup-hourly-nodb:
        bad-backup-every:
        bad-access-link:
        bad-ghcr:
        bad-autodeploy-devs:
        bad-unknown-key:
        bad-server-name:
        bad-telegram:
        bad-top-key:
        bad-people-null:
        bad-person-run:
        bad-rootless:
        bad-rootless-clash:
        bad-summary-time:
        bad-telegram-proxy:
        bad-admin-in-people:
        bad-person-key:
        bad-person-string:
        bad-ip:
        bad-ip-list:
        bad-admin-ip:
