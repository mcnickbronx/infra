# Общее для всех тестовых серверов — то, что на настоящем сервере обязательно в server.yml.
# (Здесь, а не в group_vars/all: умолчания движка в tests/group_vars важнее группы all инвентаря.)
# Вымышленные адреса и ключ: эталонные файлы не меняются, когда меняются ваши.
server_name: "{{ inventory_hostname }}"
admin_keys: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFixtureAdminKey000000000000000000000 admin@fixture"
admin_ips: [192.0.2.10, 198.51.100.0/29, "2001:db8::10"]
acme_email: admin@fixture.test

# Факты сервера — не здесь: Ubuntu, память и CPU — в tests/facts.yml, адрес — в tests/render.yml.
# Роли читают их через ansible_facts[...], а его в инвентаре не задать
