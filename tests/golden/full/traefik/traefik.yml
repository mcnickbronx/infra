# Управляется Ansible
entryPoints:
  web:
    address: ":80"
    http:
      # То же, что на websecure: заголовки-двойники выбрасываются.
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    # readTimeout — время на весь запрос вместе с телом: умолчание 60s обрывало загрузку дольше минуты
    # (ответ 499 или 504, приложению — обрезанное тело); 300s — 100 МБ при отдаче от 2,7 Мбит/с. Отдельного таймаута
    # на заголовки у Traefik нет — медленный клиент (slowloris) держит соединение до 5 минут.
    # idleTimeout 180s и writeTimeout 0 — умолчания: SSE и долгие ответы не режутся
    transport:
      respondingTimeouts:
        readTimeout: 300s
    http:
      # Заголовки-двойники с «_» или «.» в имени (X_Forwarded_For, X.Real.Ip) выбрасываются:
      # бэкенд, который не отличает их от настоящих, не получит подделку. Без опции Traefik
      # предупреждает при каждом старте.
      aliasHeadersStrategy: delete
      # Все роутеры на 443 автоматически получают SSL и заголовки безопасности,
      # командам не нужно прописывать это в labels. Баны CrowdSec действуют раньше,
      # в файрволе (firewall-bouncer, роль crowdsec): забаненный IP сюда не доходит.
      # Лимиты от HTTP-флуда — тоже на всех сайтах. Таймауты соединений — выше, у входа (transport).
      tls:
        certResolver: le
      middlewares:
        - site-ratelimit@file
        - site-inflight@file
        - security-headers@file
        - compress@file

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  le:
    acme:
      email: admin@fixture.test
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web

accessLog:
  filePath: /logs/access.log

log:
  level: INFO
