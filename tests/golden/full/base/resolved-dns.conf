# Управляется Ansible (роль base): DNS сервера — dns_servers в /etc/infra/server.yml.
# Глобальные: systemd-resolved спрашивает их параллельно с DNS хостера (на интерфейсе, от DHCP)
# и берёт первый удачный ответ (systemd-resolved.service(8), «Protocols and Routing»)
[Resolve]
