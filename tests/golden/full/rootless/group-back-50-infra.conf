# Управляется Ansible (роль rootless). Лимиты группы back проектов без root — на всего её
# пользователя back-run: Docker и контейнеры всех её проектов. Сумма лимитов проектов группы
# (у каждого проекта ещё свой — proj-<проект>.slice); сам Docker без root занимает ~120 МБ из них.
[Slice]
MemoryMax=1610612736
MemorySwapMax=0
CPUQuota=150%
TasksMax=8192
