# Управляется Ansible (роль rootless). Лимиты группы lab проектов без root — на всего её
# пользователя lab-run: Docker и контейнеры всех её проектов. Сумма лимитов проектов группы
# (у каждого проекта ещё свой — proj-<проект>.slice); сам Docker без root занимает ~120 МБ из них.
[Slice]
MemoryMax=2147483648
MemorySwapMax=0
CPUQuota=200%
TasksMax=8192
