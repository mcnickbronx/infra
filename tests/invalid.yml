# Каждый сервер группы invalid (tests/inventory) описан с одной ошибкой. Проверки
# инвентаря (роль preflight) должны остановиться на ней с сообщением из expect_error.
# Проверка, которую случайно ослабили или сломали, здесь покраснеет.
# Запуск — через tools/check.sh.
- name: Проверки инвентаря ловят ошибки
  hosts: invalid
  gather_facts: false
  tasks:
    - name: Факты сервера
      ansible.builtin.import_tasks: facts.yml

    - name: Описание с ошибкой
      block:
        - name: Проверки инвентаря
          ansible.builtin.include_role:
            name: preflight

        - name: Ошибка не поймана
          ansible.builtin.fail:
            msg: "проверки инвентаря пропустили ошибку"
      rescue:
        - name: Остановились на нужной ошибке
          ansible.builtin.assert:
            that: expect_error in (ansible_failed_result | to_json(ensure_ascii=false))
            fail_msg: "Ждали «{{ expect_error }}», а получили: {{ ansible_failed_result.msg | default(ansible_failed_result) }}"
            quiet: true

# Роль traefik не трогает настройки Traefik, если образ на сервере старше нужного им
# (roles/traefik/tasks/image.yml). Вместо docker — заглушка: ярлык версии образа она берёт
# из STUB_LABEL, «нет» — образа на сервере нет
- name: Старый образ Traefik останавливает apply
  hosts: fixture
  gather_facts: false
  vars:
    stub_path: "{{ stub.path }}:{{ lookup('ansible.builtin.env', 'PATH') }}"
  tasks:
    - name: Папка для заглушки docker
      ansible.builtin.tempfile:
        state: directory
      register: stub

    - name: Заглушка docker
      ansible.builtin.copy:
        dest: "{{ stub.path }}/docker"
        mode: "0755"
        content: |
          #!/bin/sh
          [ "$1 $2" = "image inspect" ] || exit 2
          [ "$STUB_LABEL" != нет ] || { echo "Error response from daemon: No such image" >&2; exit 1; }
          echo "$STUB_LABEL"

    - name: Образ ровно нужный, новее или его нет — дальше
      ansible.builtin.include_role:
        name: traefik
        tasks_from: image
        apply:
          environment: {PATH: "{{ stub_path }}", STUB_LABEL: "{{ item }}"}
      loop: [v3.7.12, v3.10.0, нет]

    - name: Образ старше нужного
      block:
        - name: Проверка образа Traefik
          ansible.builtin.include_role:
            name: traefik
            tasks_from: image
            apply:
              environment: {PATH: "{{ stub_path }}", STUB_LABEL: v3.7.11}

        - name: Ошибка не поймана
          ansible.builtin.fail:
            msg: "образ Traefik v3.7.11 не остановил apply"
      rescue:
        - name: Остановились с советом infra update
          ansible.builtin.assert:
            that: "'Traefik v3.7.11' in ansible_failed_result.msg and 'sudo infra update' in ansible_failed_result.msg"
            fail_msg: "Ждали остановку с «sudo infra update», а получили: {{ ansible_failed_result.msg }}"
            quiet: true

    - name: Образ без ярлыка версии
      block:
        - name: Проверка образа Traefik
          ansible.builtin.include_role:
            name: traefik
            tasks_from: image
            apply:
              environment: {PATH: "{{ stub_path }}", STUB_LABEL: ""}

        - name: Ошибка не поймана
          ansible.builtin.fail:
            msg: "образ Traefik без ярлыка версии не остановил apply"
      rescue:
        - name: Остановились — версию не узнать
          ansible.builtin.assert:
            that: "'без ярлыка версии' in ansible_failed_result.msg and 'sudo infra update' in ansible_failed_result.msg"
            fail_msg: "Ждали остановку «без ярлыка версии», а получили: {{ ansible_failed_result.msg }}"
            quiet: true

    - name: Заглушка убрана
      ansible.builtin.file:
        path: "{{ stub.path }}"
        state: absent

# Напоминание preflight — не отказ, первая игра его не видит. У full задан watch_sites, а Telegram
# нет (fake-secrets.yml): напоминание есть; с ботом и чатом или без watch_sites — нет
- name: watch_sites без Telegram — напоминание
  hosts: fixture
  gather_facts: false
  tasks:
    - name: Факты сервера
      ansible.builtin.import_tasks: facts.yml

    - name: Пароли сервера без Telegram — запомнить
      ansible.builtin.set_fact:
        no_telegram_secrets: "{{ secrets_file }}"

    - name: Проверки инвентаря — watch_sites задан, Telegram нет
      ansible.builtin.include_role:
        name: preflight

    - name: Напоминание напечатано
      ansible.builtin.assert:
        that:
          - preflight_watch_no_telegram is defined and preflight_watch_no_telegram is not skipped
          - "'watch_sites' in preflight_watch_no_telegram.msg"
        fail_msg: "Ждали напоминание «watch_sites задан, а Telegram не настроен», а получили: {{ preflight_watch_no_telegram | default('нет задачи') }}"
        quiet: true

    - name: Проверки инвентаря — watch_sites задан, бот и чат тоже
      ansible.builtin.include_role:
        name: preflight
      vars:
        secrets_file: "{{ no_telegram_secrets | combine({'telegram_bot_token': '123456:fixture', 'telegram_chat_id': '-1001234567890'}) }}"

    - name: С Telegram напоминания нет
      ansible.builtin.assert:
        that: preflight_watch_no_telegram is skipped
        fail_msg: "Ждали без напоминания (бот и чат заданы), а получили: {{ preflight_watch_no_telegram }}"
        quiet: true

    - name: Проверки инвентаря — без watch_sites, Telegram нет
      ansible.builtin.include_role:
        name: preflight
      vars:
        watch_sites: []

    - name: Без watch_sites напоминания нет
      ansible.builtin.assert:
        that: preflight_watch_no_telegram is skipped
        fail_msg: "Ждали без напоминания (watch_sites пуст), а получили: {{ preflight_watch_no_telegram }}"
        quiet: true

# Пинги пока работают: предупреждение об удалении не останавливает весь preflight.
# Синтетические URL без example.com проходят и последнюю проверку заготовок; в сообщении их нет
- name: Healthchecks — предупреждение об удалении без URL
  hosts: fixture
  gather_facts: false
  vars:
    backup_url: "https://hc.fixture.test/ping/backup-private-id"
    monitor_url: "https://hc.fixture.test/ping/monitor-private-id"
  tasks:
    - name: Факты сервера
      ansible.builtin.import_tasks: facts.yml

    - name: Проверки инвентаря — оба healthcheck_url пусты
      ansible.builtin.include_role:
        name: preflight
      vars:
        backup_healthcheck_url: ""
        monitor_healthcheck_url: ""

    - name: Без healthchecks предупреждения нет
      ansible.builtin.assert:
        that: preflight_healthchecks_deprecated is skipped
        quiet: true

    - name: Проверки инвентаря — только пинг бэкапа
      ansible.builtin.include_role:
        name: preflight
      vars:
        backup_healthcheck_url: "{{ backup_url }}"
        monitor_healthcheck_url: ""

    - name: Предупреждение называет только ключ бэкапа, без URL
      ansible.builtin.assert:
        that:
          - preflight_healthchecks_deprecated is not skipped
          - "'v3.0.0' in preflight_healthchecks_deprecated.msg"
          - "'backup_healthcheck_url' in preflight_healthchecks_deprecated.msg"
          - "'monitor_healthcheck_url' not in preflight_healthchecks_deprecated.msg"
          - backup_url not in preflight_healthchecks_deprecated.msg
          - "'ADMIN.md' in preflight_healthchecks_deprecated.msg"
        quiet: true

    - name: Проверки инвентаря — только пинг мониторинга
      ansible.builtin.include_role:
        name: preflight
      vars:
        backup_healthcheck_url: ""
        monitor_healthcheck_url: "{{ monitor_url }}"

    - name: Предупреждение называет только ключ мониторинга, без URL
      ansible.builtin.assert:
        that:
          - preflight_healthchecks_deprecated is not skipped
          - "'v3.0.0' in preflight_healthchecks_deprecated.msg"
          - "'backup_healthcheck_url' not in preflight_healthchecks_deprecated.msg"
          - "'monitor_healthcheck_url' in preflight_healthchecks_deprecated.msg"
          - monitor_url not in preflight_healthchecks_deprecated.msg
        quiet: true

    - name: Проверки инвентаря — оба пинга
      ansible.builtin.include_role:
        name: preflight
      vars:
        backup_healthcheck_url: "{{ backup_url }}"
        monitor_healthcheck_url: "{{ monitor_url }}"

    - name: Одно предупреждение называет оба ключа, без URL
      ansible.builtin.assert:
        that:
          - preflight_healthchecks_deprecated is not skipped
          - preflight_healthchecks_deprecated.results is not defined
          - "'v3.0.0' in preflight_healthchecks_deprecated.msg"
          - "'backup_healthcheck_url' in preflight_healthchecks_deprecated.msg"
          - "'monitor_healthcheck_url' in preflight_healthchecks_deprecated.msg"
          - backup_url not in preflight_healthchecks_deprecated.msg
          - monitor_url not in preflight_healthchecks_deprecated.msg
        quiet: true
