# Все шаблоны ролей на тестовом инвентаре (tests/inventory): результат — в
# tests/golden/<сервер>/, эталон лежит в git. Любое изменение правил (белый список,
# pg_hba, лимиты...) видно в git diff tests/golden, как обычный код.
# Запуск — через tools/check.sh (он же сравнивает с эталоном).
- name: Шаблоны на тестовых серверах
  hosts: fixture
  gather_facts: false
  vars:
    out: "{{ playbook_dir }}/golden/{{ inventory_hostname }}"
    templates:
      - base/10-hardening.conf
      - base/whitelist.json
      - base/resolved-dns.conf
      - docker/daemon.json
      - docker/base.yml
      - postgres/90-ansible.conf
      - postgres/pg_hba.conf
      - traefik/compose.yml
      - traefik/traefik.yml
      - traefik/middlewares.yml
      - crowdsec/acquis-traefik.yaml
      - crowdsec/whitelist-admins.yaml
      - crowdsec/allowlist.json
      - access/config.json
      - access/traefik-access.yml
      - backup/backup.sh
      - backup/backup-hourly.sh
      - backup/backup-hourly.timer
      - backup/env
      - backup/s3-env
      - backup/projects.json
      - monitoring/health-check.sh
      - monitoring/health-check-summary.timer
      - rootless/infra0.service
    # Вычисляемые значения (derived.yml): от них зависят все правила доступа
    derived:
      host_people: "{{ host_people }}"
      ssh_allowed_ips: "{{ ssh_allowed_ips }}"
      server_ips: "{{ server_ips }}"
      db_projects: "{{ db_projects | map(attribute='key') | list }}"
      autodeploy_projects: "{{ autodeploy_projects }}"
      hourly_backup_projects: "{{ hourly_backup_projects }}"
      backup_hourly_step: "{{ backup_hourly_step }}"
      access_host: "{{ access_host }}"
      postgres_memory_share: "{{ postgres_memory_share }}"
      project_default_cpus: "{{ project_default_cpus }}"
      people_groups: "{{ people_groups }}"
      rootless_projects: "{{ rootless_projects }}"
      rootless_group_of: "{{ rootless_group_of }}"
      # Умолчания, которые читают только задачи ролей (в шаблонах их нет): без этих строк пропажу
      # или другое число в group_vars офлайн не видно, а apply на сервере падает или меняет владельцев файлов
      docker_major_version: "{{ docker_major_version }}"
      postgres_version: "{{ postgres_version }}"
      docker_remap_base: "{{ docker_remap_base }}"
      docker_remap_web_gids: "{{ docker_remap_web_gids }}"
      rootless_port_base: "{{ rootless_port_base }}"
      project_default_db_conn_limit: "{{ project_default_db_conn_limit }}"
      project_default_db_statement_timeout: "{{ project_default_db_statement_timeout }}"
  tasks:
    # Факты из ansible_facts в инвентаре не задать (его заполняет сам Ansible) — только так
    - name: Факты сервера
      ansible.builtin.import_tasks: facts.yml

    - name: Факты сервера — свой адрес
      ansible.builtin.set_fact:
        ansible_default_ipv4: {address: 192.0.2.1}
        cacheable: true

    - name: Проверки инвентаря проходят
      ansible.builtin.import_role:
        name: preflight

    # Заново: шаблон, которого больше нет, не должен остаться в эталоне
    - name: Прежний результат удалён
      ansible.builtin.file:
        path: "{{ out }}"
        state: absent

    - name: Папки результата
      ansible.builtin.file:
        path: "{{ out }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ templates | map('dirname') | unique | list + ['project'] }}"

    - name: Шаблоны ролей
      ansible.builtin.template:
        src: "../roles/{{ item | dirname }}/templates/{{ item | basename }}.j2"
        dest: "{{ out }}/{{ item }}"
        mode: "0644"
      loop: "{{ templates }}"

    - name: Лимиты проектов (slice)
      ansible.builtin.template:
        src: ../roles/project/templates/project.slice.j2
        dest: "{{ out }}/project/proj-{{ item.key }}.slice"
        mode: "0644"
      loop: "{{ projects | dict2items | rejectattr('key', 'in', rootless_projects) }}"
      loop_control:
        label: "{{ item.key }}"

    # Пользователь группы — как на сервере (<группа>-run), uid в имени файла — нет: его даёт роль rootless
    - name: Лимиты групп проектов без root (user-<uid>.slice.d/50-infra.conf)
      ansible.builtin.template:
        src: ../roles/rootless/templates/slice-limits.conf.j2
        dest: "{{ out }}/rootless/group-{{ item.group }}-50-infra.conf"
        mode: "0644"
      loop: "{{ rootless_groups | map('regex_replace', '^(.+)$', '{\"group\": \"\\1\", \"user\": \"\\1-run\"}')
                | map('from_json') | list }}"
      loop_control:
        label: "{{ item.group }}"

    - name: Лимиты проектов в Docker групп (proj-<проект>.slice у systemd пользователя)
      ansible.builtin.template:
        src: ../roles/rootless/templates/project-slice.j2
        dest: "{{ out }}/rootless/proj-{{ item }}.slice"
        mode: "0644"
      loop: "{{ rootless_projects }}"

    - name: Вычисляемые значения
      ansible.builtin.copy:
        content: "{{ derived | to_nice_json(sort_keys=true) }}\n"
        dest: "{{ out }}/derived.json"
        mode: "0644"
