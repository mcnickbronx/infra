# Проверки при каждом push и pull request — те же, что tools/check.sh у администратора
# (make check). На серверы ничего не раскатывает.
# Версии закреплены (requirements-dev.txt): без изменений в репозитории проверка не должна вдруг покраснеть.
# Репозиторий открытый: у проверки только чтение (pull request из форка ничего не изменит и секретов
# не получит), сторонние действия — по хешу коммита, а не по тегу, который их автор может перевесить.
name: lint
"on": [push, pull_request]   # в кавычках: иначе yamllint читает on как true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1      # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Ansible, ansible-lint, shellcheck (версии — requirements-dev.txt)
        run: pip install -r requirements-dev.txt

      - name: Коллекции закреплённых версий ставятся
        run: ansible-galaxy collection install -r requirements.yml

      - name: Все проверки (tools/check.sh)
        run: tools/check.sh
