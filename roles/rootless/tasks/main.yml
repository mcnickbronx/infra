# Проекты без root (rootless: true у проекта): настройка — setup.yml, если такие проекты есть;
# уборка у проектов, которым rootless убрали, — cleanup.yml, всегда

# Владельцы файлов, созданных контейнерами, — при переводе в обе стороны (setup и cleanup)
- name: project-rootless-files — владельцы файлов при смене Docker проекта
  ansible.builtin.copy:
    src: project-rootless-files
    dest: /usr/local/sbin/project-rootless-files
    mode: "0755"

- name: Проекты без root
  ansible.builtin.include_tasks: setup.yml
  when: rootless_projects | length > 0

- name: Уборка у проектов, которым убрали rootless
  ansible.builtin.include_tasks: cleanup.yml
