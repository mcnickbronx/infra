# Управляется Ansible (роль crowdsec). Запрос к файлу .env на любом сайте сервера — бан с первого
# раза: так ищут пароли, а настоящему посетителю .env не нужен никогда (и ни один сайт его не отдаёт:
# ни наши, ни WordPress). Общий сценарий crowdsecurity/http-sensitive-files тоже ловит .env, но после
# 4 разных таких запросов за 5 секунд — сканер успевает попробовать. Бан — на обычный срок
# (profiles.yaml CrowdSec, 4 часа). Свои IP (admin_ips) не банятся: белый список раньше сценариев.
# Ловит /.env, /api/.env, /.env.production, /.env_bak, /.env?x=1; не ловит /.envrc и /environment.
type: trigger
format: 2.0
name: infra/http-env-file
description: "Request for a .env file: secrets probing, never a real visitor"
filter: |
  evt.Meta.log_type in ["http_access-log", "http_error-log"] and
  evt.Meta.http_path matches "(?i)/\\.env([^a-z0-9]|$)"
groupby: evt.Meta.source_ip
blackhole: 1m
labels:
  remediation: true
  classification:
    - attack.T1595.003
  behavior: "http:scan"
  label: "Request for a .env file"
  spoofable: 0
  service: http
  confidence: 3
