# Все проверки описания сервера (/etc/infra/server.yml и ключи в secrets.yml) в одном месте.
# Выполняются при любом запуске, даже с --tags: ошибка в описании должна
# останавливать плейбук до того, как что-то поменяется на сервере.
# Только описание, сервер не спрашивают: поэтому работают и без сервера
# (tests/render.yml, tests/invalid.yml). Проверки состояния сервера — в ролях base и users.

# ---------- Сервер и администратор ----------
# Стандарт — одна версия Ubuntu на всех серверах (ubuntu_version в main.yml, сейчас 26.04):
# одинаковые пакеты, одинаковое поведение, одна проверка на тестовой VDS.
- name: Сервер — Ubuntu {{ ubuntu_version }}
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == ubuntu_version | string
    fail_msg: >-
      {{ inventory_hostname }}: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }},
      а серверы должны быть на Ubuntu {{ ubuntu_version }}. Переустановите сервер
      на Ubuntu {{ ubuntu_version }} в панели хостера. На 24.04 движок тоже работает, но это
      не желательно (README, «Ограничения»): тогда ubuntu_version: "24.04" в server.yml
    quiet: true

# Без них движку не из чего строить сервер; значений по умолчанию у них нет. Текст — о том, что не так:
# при всех ключах на месте «нет: —» сбивало с толку, поэтому тогда — само неподходящее имя сервера
- name: В server.yml заданы server_name, admin_keys, admin_ips, acme_email
  vars:
    required: [server_name, admin_keys, admin_ips, acme_email]
    missing: "{{ required | difference(query('ansible.builtin.varnames', '^(' ~ required | join('|') ~ ')$')) }}"
  ansible.builtin.assert:
    that:
      - missing | length == 0
      - missing | length > 0 or server_name is match('^[a-z0-9][a-z0-9-]{0,62}$')
    fail_msg: >-
      {% if missing | length > 0 %}В {{ infra_dir }}/server.yml нет: {{ missing | join(', ') }}; server_name — строчные
      латинские буквы, цифры и - (пример всех настроек — server.yml.example){% else %}В {{ infra_dir }}/server.yml
      server_name «{{ server_name }}» не годится: server_name — строчные латинские буквы, цифры и - (до 63 знаков,
      первая — не -){% endif %}
    quiet: true

# Опечатка в ключе молча значила бы «настройки нет» — то есть умолчание движка, иногда
# разрушительное: docker_user: вместо docker_users: убрала бы людей из группы docker,
# restic_s3_repository: — выключила бы копию в S3. Известны обязательные ключи, test_server
# и любое умолчание движка (group_vars/all/main.yml). server_settings — сам server.yml,
# его читают site.yml и update.yml
- name: В server.yml только известные ключи
  vars:
    known: "{{ ['server_name', 'admin_keys', 'admin_ips', 'acme_email', 'test_server']
               + (lookup('ansible.builtin.file', role_path ~ '/../../group_vars/all/main.yml') | from_yaml | list) }}"
    unknown: "{{ server_settings | list | difference(known) }}"
  ansible.builtin.assert:
    that: unknown | length == 0
    fail_msg: >-
      В {{ infra_dir }}/server.yml неизвестные ключи {{ unknown }} — опечатка? Все настройки —
      server.yml.example; любое умолчание движка — group_vars/all/main.yml
    quiet: true
  when: server_settings is defined

# Раздел, где закомментированы все строки, — пустое значение (null), а не пустой словарь или
# список: дальше была бы непонятная ошибка Jinja
- name: projects и people — словари, admin_ips и docker_users — списки
  ansible.builtin.assert:
    that:
      - projects is mapping
      - people is mapping
      - admin_ips is sequence and admin_ips is not string
      - docker_users is sequence and docker_users is not string
    fail_msg: >-
      В {{ infra_dir }}/server.yml projects и people — словари (имя: настройки), admin_ips и docker_users —
      списки. Пустые — {} и [], а не раздел из одних комментариев
    quiet: true

# SSH пускает только с admin_ips и IP участников: без admin_ips после включения файрвола
# администратор на сервер не войдёт
- name: admin_ips не пуст
  ansible.builtin.assert:
    that: admin_ips | length > 0
    fail_msg: "admin_ips пуст: после включения файрвола на сервер не войти. Впишите свои IP в server.yml"
    quiet: true

# ---------- Проекты ----------
- name: Имена проектов подходят для групп Linux и баз (a-z, 0-9, _; до 28 символов)
  ansible.builtin.assert:
    that: item is match('^[a-z][a-z0-9_]{0,27}$')
    fail_msg: "Имя проекта '{{ item }}': только строчные латинские буквы, цифры и _, начинается с буквы"
    quiet: true
  loop: "{{ projects.keys() | list }}"

# Имя проекта становится именем базы, пользователя базы и compose-проекта. Эти заняты:
# postgres — суперпользователь Postgres (роль проекта переписала бы его права);
# template0/1 — шаблоны Postgres; traefik — compose-проект самого Traefik
# (docker compose down остановил бы все сайты); all, sameuser, samerole, replication — слова
# pg_hba.conf: строка проекта all пускала бы его сеть в любую базу любым пользователем.
- name: Имена проектов не заняты системой
  vars:
    reserved: [postgres, template0, template1, traefik, all, sameuser, samerole, replication]
  ansible.builtin.assert:
    that: projects.keys() | intersect(reserved) | length == 0
    fail_msg: "Имя проекта занято системой: {{ projects.keys() | intersect(reserved) }}. Выберите другое"
    quiet: true

# Опечатка в ключе молча значила бы «ключа нет», а это разрушительно: dev: вместо devs: удалила бы
# аккаунт участника, bd: вместо db: закрыла бы вход в базу и остановила её дампы.
# Все ключи с пояснениями — server.yml.example
- name: У проектов только известные ключи
  vars:
    known: [net, domains, db, db_conn_limit, db_statement_timeout, memory, cpus, autodeploy, backup_hourly, backup_every, devs, rootless, image]
  ansible.builtin.assert:
    that: item.value.keys() | difference(known) | length == 0
    fail_msg: >-
      Проект '{{ item.key }}': неизвестные ключи {{ item.value.keys() | difference(known) }} — опечатка?
      Известные: {{ known | join(', ') }} (server.yml.example)
    quiet: true
  loop: "{{ projects | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: "У каждого проекта есть net (1..254), db — только postgres"
  ansible.builtin.assert:
    that:
      - item.value.net is defined and item.value.net | int >= 1 and item.value.net | int <= 254
      - item.value.db is not defined or item.value.db == 'postgres'
    fail_msg: "Проект '{{ item.key }}': нужен net (1..254); db — только postgres (или без базы)"
    quiet: true
  loop: "{{ projects | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Номера сетей проектов не повторяются
  vars:
    nets: "{{ projects.values() | map(attribute='net') | map('int') | list }}"
  ansible.builtin.assert:
    that: nets | length == nets | unique | length
    fail_msg: "net проектов повторяются: {{ nets }}"
    quiet: true

- name: "Лимиты проектов: memory — число с m или g (512m, 2g), cpus — число больше 0"
  ansible.builtin.assert:
    that:
      - item.value.memory is not defined or (item.value.memory | string) is match('^[0-9]+[mMgG]$')
      - item.value.cpus is not defined or (item.value.cpus | float) > 0
    fail_msg: "Проект '{{ item.key }}': memory как 512m или 2g, cpus — число (1, 1.5, 2)"
    quiet: true
  loop: "{{ projects | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# Ссылка доступа: true/false; срок — целые часы, не больше трёх суток (порт открыт и соседям IP
# по оператору); свой адрес — имя хоста, без https:// и пути
- name: "access_link — true или false, access_link_hours — 1..72, access_link_host — имя хоста"
  ansible.builtin.assert:
    that:
      - access_link is boolean
      - access_link_hours | string is match('^[0-9]+$') and access_link_hours | int >= 1 and access_link_hours | int <= 72
      - access_link_host == '' or access_link_host is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?([.][a-z0-9]([a-z0-9-]*[a-z0-9])?)+$')
    fail_msg: >-
      access_link — true или false (без кавычек); access_link_hours — число часов от 1 до 72;
      access_link_host — имя хоста (access.example.ru), без https:// и пути, или пусто (<IP>.sslip.io)
    quiet: true

# Частые снимки: backup_hourly — что (db — только база, у проекта должна быть база; all — база
# и папки проекта), backup_every — как часто, минут. true или опечатка выглядели бы включёнными,
# а снимков бы не было. Значения backup_every делят друг друга: таймер срабатывает с шагом самого
# частого проекта, и минута каждого попадает на срабатывание (10 и 15 так не сошлись бы)
- name: "backup_hourly у проекта — db или all; backup_every — 1, 5, 15, 30 или 60 минут"
  ansible.builtin.assert:
    that:
      - item.value.backup_hourly is not defined or item.value.backup_hourly in ['db', 'all']
      - item.value.backup_hourly | default('') != 'db' or item.value.db is defined
      - item.value.backup_every is not defined or (item.value.backup_hourly is defined
        and item.value.backup_every | string in ['1', '5', '15', '30', '60'])
    fail_msg: >-
      Проект '{{ item.key }}': backup_hourly — db (только база; у проекта должна быть db: postgres)
      или all (база и папки проекта); backup_every — минут между снимками: 1, 5, 15, 30 или 60
      (по умолчанию 60), только вместе с backup_hourly
    quiet: true
  loop: "{{ projects | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# autodeploy: "yes" (строка) выглядело бы включённым
- name: У проекта autodeploy — true или false
  ansible.builtin.assert:
    that: item.value.autodeploy is not defined or item.value.autodeploy is boolean
    fail_msg: "Проект '{{ item.key }}': autodeploy — true или false, без кавычек"
    quiet: true
  loop: "{{ projects | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: У проекта rootless — true, false или имя группы
  ansible.builtin.assert:
    that:
      - item.value.rootless is not defined or item.value.rootless is boolean
        or (item.value.rootless | string) is match('^[a-z][a-z0-9_]{0,27}$')
    fail_msg: >-
      Проект '{{ item.key }}': rootless — true, false или имя группы (строчные латинские буквы,
      цифры и _, до 28 символов)
    quiet: true
  loop: "{{ projects | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# image — репозиторий образа проекта: автовыкладка, to и перевод в Docker без root скачивают образ из .env
# (DEPLOY_IMAGE), только если он из этого репозитория. Сравнение — строкой: с тегом, дайджестом или заглавными
# (в имени образа Docker их не принимает) ключ не совпал бы ни с одним образом. Ключ попадает в скрипты root — \Z, а не $
- name: У проекта image — репозиторий образа без тега, строчными
  vars:
    image_re: '^[a-z0-9][a-z0-9.-]*(:[0-9]+)?(/[a-z0-9][a-z0-9._-]*)+\Z'
  ansible.builtin.assert:
    that:
      - item.value.image is not defined or (item.value.image is string and item.value.image is match(image_re))
    fail_msg: >-
      Проект '{{ item.key }}': image — репозиторий образа без тега и дайджеста, строчными:
      ghcr.io/<владелец>/<образ>
    quiet: true
  loop: "{{ projects | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# Образы приватные — без токена таймер автовыкладки падал бы каждые 15 секунд
- name: При автовыкладке — вход в ghcr.io в secrets.yml
  ansible.builtin.assert:
    that: autodeploy_projects | length == 0 or (ghcr_user != '' and ghcr_token != '')
    fail_msg: >-
      autodeploy: true у {{ autodeploy_projects | join(', ') }} — в {{ infra_dir }}/secrets.yml нужны
      ghcr_user и ghcr_token (токен GitHub classic с правом read:packages)
    quiet: true

# Группа проектов без root, названная как чужой проект, — это один пользователь <имя>-run и один Docker
# на двоих: проект оказался бы в группе, где его не ждут
- name: Группа проектов без root не называется как другой проект
  vars:
    clash: >-
      {%- set c = [] -%}
      {%- for g in rootless_groups if g in projects and rootless_group_of.get(g) != g -%}
      {%-   set _ = c.append(g) -%}
      {%- endfor -%}
      {{ c }}
  ansible.builtin.assert:
    that: clash | length == 0
    fail_msg: "rootless: {{ clash }} — так называется другой проект; у группы проектов без root — своё имя (back, front…)"
    quiet: true

# Автовыкладка без проверки запускает от root compose.yml из образа, а образ выбирает .env проекта:
# участник проекта (пишет в web/) фактически root на сервере, как docker_users. Пусть это будет
# видно в описании (DECISIONS.md, «Автовыкладка»). У проекта без root (rootless) compose запускает
# его пользователь <проект>-run — там участникам Docker не нужен
- name: Участники проектов с автовыкладкой — в docker_users
  vars:
    not_docker: "{{ projects | dict2items | selectattr('key', 'in', autodeploy_projects | difference(rootless_projects))
                    | map(attribute='value.devs', default=[]) | flatten | unique | difference(docker_users) }}"
  ansible.builtin.assert:
    that: not_docker | length == 0
    fail_msg: >-
      {{ not_docker }}: участники проектов с автовыкладкой, но не в docker_users. Автовыкладка запускает
      compose.yml проекта от root — его участник фактически root на сервере. Добавьте их в docker_users
      или уберите autodeploy (DECISIONS.md, «Автовыкладка»)
    quiet: true

# ---------- Люди ----------
- name: Все участники проектов описаны в people
  ansible.builtin.assert:
    that: host_people | difference(people.keys()) | length == 0
    fail_msg: >-
      Нет в people: {{ host_people | difference(people.keys()) }} — участники проектов (devs) описываются
      в people: key (SSH-ключ) и ips (адреса)
    quiet: true

- name: Администратора нет в people
  ansible.builtin.assert:
    that: admin_user not in people
    fail_msg: >-
      {{ admin_user }} — администратор, его не должно быть в people (иначе его можно случайно удалить):
      его ключи и IP — admin_keys и admin_ips
    quiet: true

- name: Имена людей — для пользователей Linux, не на -run и -dev
  vars:
    bad_names: >-
      {{ (people.keys() | reject('match', '^[a-z][a-z0-9_-]{0,31}$') | list)
         + (people.keys() | select('match', '.*-(run|dev)$') | list) }}
  ansible.builtin.assert:
    that: bad_names | length == 0
    fail_msg: >-
      Имена в people: {{ bad_names | unique }} — строчные латинские буквы, цифры, _ и -, не на -run и -dev
      (так называются пользователь и группа проекта)
    quiet: true

# Опечатка в ключе человека молча значила бы «нет»: ip: вместо ips: — человеку закрыт SSH,
# keys: вместо key: — сообщение про испорченный ключ, хотя ключ в порядке. Все люди, не только
# участники проектов этого сервера: опечатку видно раньше, чем человека впишут в devs.
# Человек без полей (pavel: ~) — то же, что pavel: {}: проходит, как раньше (в devs его ловит
# проверка ключа). Стоп — только на значении не словарём, например ключ строкой (ivan: "ssh-ed25519 …")
- name: У людей только key и ips
  vars:
    extra: "{{ (people[item] if people[item] is mapping else {}) | list | difference(['key', 'ips']) }}"
  ansible.builtin.assert:
    that: people[item] is none or (people[item] is mapping and extra | length == 0)
    fail_msg: >-
      people.{{ item }}: {{ ('неизвестные ключи ' ~ extra | string ~ ' — опечатка? У человека только key (SSH-ключ)
      и ips (адреса)') if people[item] is mapping else 'не словарь — нужно key: и ips: с отступом под именем' }}
    quiet: true
  loop: "{{ people.keys() | list }}"
  loop_control:
    label: "{{ item }}"

# Адрес с опечаткой (198.51.100.300, /33) иначе остановил бы прогон позже ошибкой Python в роли base,
# а если base его не проверит (запуск из консоли хостера) — ушёл бы в файрвол и CrowdSec.
# Правило то же, что у base и infra init (bad_ips): ip_network(a, strict=False) — IPv4 и IPv6,
# подсети, в том числе с битами хоста (192.0.2.5/24). ips строкой — один адрес, как у people_ips
- name: Адреса в admin_ips и ips людей
  vars:
    addrs: >-
      {%- set d = {'admin_ips': admin_ips} -%}
      {%- for name, p in people.items() if p is mapping -%}
      {%-   set _ = d.update({'people.' ~ name: [p.ips | default([])] | flatten}) -%}
      {%- endfor -%}
      {{ d }}
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -I
      - -c
      - |
        import ipaddress, json, sys
        for who, addrs in json.loads(sys.argv[1]).items():
            for a in addrs:
                try:
                    ipaddress.ip_network(a, strict=False)
                except ValueError:
                    print(f"'{a}' ({who})")
      - "{{ addrs | to_json }}"
  register: bad_addrs
  changed_when: false
  check_mode: false     # только читает; иначе в --check stdout пустой и проверка ниже не работает

- name: admin_ips и ips людей — IP или подсети
  ansible.builtin.assert:
    that: bad_addrs.stdout == ''
    fail_msg: >-
      Не IP и не подсеть: {{ bad_addrs.stdout_lines | join(', ') }} в server.yml. Нужно вида 203.0.113.10,
      203.0.113.0/24 или 2001:db8::1 — по одному адресу на элемент списка
    quiet: true

# DNS сервера — только адреса, без подсетей и портов: адрес с ошибкой systemd-resolved пропускает
# (строкой в своём журнале), и сервер остался бы на DNS хостера. Строка вместо списка — тоже стоп
- name: Адреса в dns_servers
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -I
      - -c
      - |
        import ipaddress, json, sys
        for a in json.loads(sys.argv[1]):
            try:
                ipaddress.ip_address(a if isinstance(a, str) else "-")   # число из YAML (8) ip_address принял бы
            except ValueError:
                print(f"'{a}'")
      - "{{ (dns_servers if dns_servers is sequence and dns_servers is not string and dns_servers is not mapping
             else []) | to_json }}"
  register: bad_dns
  changed_when: false
  check_mode: false     # только читает; иначе в --check stdout пустой и проверка ниже не работает

- name: dns_servers — список IP-адресов
  ansible.builtin.assert:
    that:
      - dns_servers is sequence and dns_servers is not string and dns_servers is not mapping
      - bad_dns.stdout == ''
    fail_msg: >-
      dns_servers в server.yml — список IP-адресов DNS вида 192.0.2.53 или 2001:db8::53, по адресу
      в элементе{{ (', не адрес: ' ~ bad_dns.stdout_lines | join(', ')) if bad_dns.stdout else '' }}
    quiet: true

# Адреса попадают в health-check.sh, который работает от root: только схема, имя или IPv4, порт и путь —
# без пробелов, кавычек, $, `, ; и перевода строки (поэтому \Z, а не $). До 10 — все проверяются разом,
# худший случай — минута
- name: watch_sites — список адресов страниц
  vars:
    url_re: '^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~/?&=%+-]*)?\Z'
    urls: "{{ watch_sites if watch_sites is sequence and watch_sites is not string and watch_sites is not mapping else [] }}"
    bad: "{{ (urls | reject('string') | list) + (urls | select('string') | reject('match', url_re) | list) }}"
  ansible.builtin.assert:
    that:
      - watch_sites is sequence and watch_sites is not string and watch_sites is not mapping
      - watch_sites | length <= 10
      - bad | length == 0
    fail_msg: >-
      watch_sites в server.yml — список до 10 адресов страниц другого сервера вида https://example.com/
      или https://back.example.com/api/health{{ (', не так: ' ~ bad | map('string') | join(', ')) if bad else '' }}
    quiet: true

# В Postgres локальный вход (peer) пускает пользователя Linux в роль с тем же именем:
# человек по имени shop вошёл бы в базу проекта shop без пароля.
- name: Имена людей и администратора не совпадают с именами проектов
  ansible.builtin.assert:
    that: (people.keys() | list + [admin_user]) | intersect(projects.keys()) | length == 0
    fail_msg: >-
      Совпадают имена человека и проекта: {{ (people.keys() | list + [admin_user]) | intersect(projects.keys()) }}.
      Переименуйте проект (или человека)
    quiet: true

# Человеку с группой docker нужен и доступ к папке проекта (compose.yml читается с его правами),
# поэтому docker_users — только из участников проектов этого сервера.
- name: docker_users — участники проектов этого сервера
  ansible.builtin.assert:
    that: docker_users | difference(host_people) | length == 0
    fail_msg: "docker_users: {{ docker_users | difference(host_people) }} — не участники проектов этого сервера (devs)"
    quiet: true

# exclusive: true оставляет на сервере только ключи из описания: заготовка или обрывок вместо
# ключа закрыли бы вход администратору или участнику. Ключей может быть несколько — по строке.
- name: SSH-ключи — настоящие ключи, а не заготовки
  vars:
    key_re: '^(ssh-(ed25519|rsa)|ecdsa-sha2-nistp\d+|sk-\S+) [A-Za-z0-9+/]{40,}={0,3}( .*)?$'
    key_msg: "незаполненный или испорченный SSH-ключ. Нужна строка вида «ssh-ed25519 AAAAC3... имя»"
  block:
    - name: SSH-ключи администратора (admin_keys)
      vars:
        lines: "{{ admin_keys | trim | split('\n') | map('trim') | reject('eq', '') | list }}"
      ansible.builtin.assert:
        that:
          - lines | length > 0
          - lines | reject('match', key_re) | list | length == 0
        fail_msg: "admin_keys: {{ key_msg }}"
        quiet: true

    - name: SSH-ключи участников (people)
      vars:
        lines: "{{ people[item].key | default('') | trim | split('\n') | map('trim') | reject('eq', '') | list }}"
      ansible.builtin.assert:
        that:
          - lines | length > 0
          - lines | reject('match', key_re) | list | length == 0
        fail_msg: "people.{{ item }}: {{ key_msg }}"
        quiet: true
      loop: "{{ host_people }}"

# ---------- Ключи, которые вписывает администратор (secrets.yml) ----------
# Пароли баз, Postgres и restic создаёт роль secrets сама; ключи S3 — из панели хранилища
- name: При включённом S3 в secrets.yml есть его ключи
  ansible.builtin.assert:
    that: restic_s3_repository_base == '' or (restic_aws_access_key_id != '' and restic_aws_secret_access_key != '')
    fail_msg: >-
      Задан restic_s3_repository_base, но в {{ infra_dir }}/secrets.yml нет s3_access_key и s3_secret_key
      (ключи бакета; у каждого сервера свои)
    quiet: true

# Уведомления в Telegram: чат без бота молча не получал бы ничего. Бот без чата — шаг настройки
# (id чата подсказывает infra-notify --find-chat по токену): не ошибка, а напоминание
- name: Telegram — чат только вместе с ботом
  ansible.builtin.assert:
    that: secrets.telegram_chat_id | default('', true) | string == '' or secrets.telegram_bot_token | default('', true) != ''
    fail_msg: "В {{ infra_dir }}/secrets.yml telegram_chat_id задан без telegram_bot_token — уведомления не уходят"
    quiet: true

# Значение прокси в сообщение не выводится: в нём бывают логин и пароль
- name: Telegram — прокси — адрес
  vars:
    tg_proxy: "{{ secrets.telegram_proxy | default('', true) }}"
  ansible.builtin.assert:
    that: tg_proxy == '' or tg_proxy is match('^(https?|socks5h?)://')
    fail_msg: "telegram_proxy в {{ infra_dir }}/secrets.yml — адрес вида socks5h://логин:пароль@хост:порт или http://хост:порт"
    quiet: true

- name: Утренняя сводка — время ЧЧ:ММ
  ansible.builtin.assert:
    that: notify_summary_time | string is match('^([01][0-9]|2[0-3]):[0-5][0-9]$')
    fail_msg: 'notify_summary_time в {{ infra_dir }}/server.yml — время ЧЧ:ММ в кавычках, например "09:00"'
    quiet: true

- name: Telegram — бот задан, чат ещё нет
  ansible.builtin.debug:
    msg: >-
      В {{ infra_dir }}/secrets.yml есть telegram_bot_token, но пустой telegram_chat_id — уведомления
      не уходят. id чата подскажет sudo infra-notify --find-chat (ADMIN.md, «Уведомления в Telegram»)
  when: secrets.telegram_bot_token | default('', true) != '' and secrets.telegram_chat_id | default('', true) | string == ''

# Сервер следит за другим, а сообщить о нём в Telegram не может — проверка шла бы молча. Бот без чата —
# уже задача выше; register — для tests/invalid.yml
- name: Telegram — watch_sites задан, бота нет
  ansible.builtin.debug:
    msg: >-
      В {{ infra_dir }}/server.yml задан watch_sites, а Telegram не настроен (нет telegram_bot_token
      в {{ infra_dir }}/secrets.yml) — «Сайты другого сервера не отвечают» в Telegram не придёт
      (ADMIN.md, «Уведомления в Telegram»)
  when: watch_sites | length > 0 and secrets.telegram_bot_token | default('', true) == ''
  register: preflight_watch_no_telegram

# Заготовка в адресе уведомлений молча выключила бы мониторинг
- name: Нет незаполненных заготовок («замените», example.com) в адресах, email и ключах S3
  vars:
    filled:
      acme_email: "{{ acme_email }}"
      backup_healthcheck_url: "{{ backup_healthcheck_url }}"
      monitor_healthcheck_url: "{{ monitor_healthcheck_url }}"
      watch_sites: "{{ watch_sites | join(' ') }}"     # example.com настоящий и отвечает: следили бы за ним
      s3_access_key: "{{ restic_aws_access_key_id }} {{ restic_aws_secret_access_key }}"
    placeholders: >-
      {{ filled | dict2items | selectattr('value', 'search', 'замените|(@|//)example\.(com|org|net)\b')
         | map(attribute='key') | list }}
  ansible.builtin.assert:
    that: placeholders | length == 0
    fail_msg: "Заполните (сейчас там заготовка): {{ placeholders | join(', ') }}"
    quiet: true
