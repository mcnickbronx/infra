# Пароли сервера — в /etc/infra/secrets.yml (только root). Файл читает site.yml (secrets_file),
# здесь создаются недостающие: пароль restic, администратора Postgres, базы каждого проекта
# (db_password_<проект>) и секрет ссылки доступа (access_token, если access_link). Уже записанные не меняются никогда. Ключи S3, ghcr и Telegram вписывает
# администратор сам (их проверяет preflight) — для них в файле всегда есть строки, пустые, пока
# не заполнены: список — в secrets.yml.example.
#
# Пароль restic держат ещё и в менеджере паролей: без него копии в S3 и у вас не расшифровать.

- name: Файл паролей закрыт от всех, кроме root
  ansible.builtin.file:
    path: "{{ infra_dir }}/secrets.yml"
    owner: root
    group: root
    mode: "0600"

# Только буквы и цифры: пароли попадают в .env проектов, строки подключения и файлы, которые
# читает bash (там $, # и кавычки что-то значат)
- name: Недостающие пароли созданы
  vars:
    needed: "{{ ['restic_password', 'postgres_admin_password']
                + (db_projects | map(attribute='key') | map('regex_replace', '^', 'db_password_') | list)
                + (['access_token'] if access_link else []) }}"
    present: "{{ secrets_file | default({}) | dict2items | selectattr('value') | map(attribute='key') | list }}"
  ansible.builtin.set_fact:
    generated_secrets: >-
      {{ generated_secrets | default({})
         | combine({item: lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=32)}) }}
  loop: "{{ needed | difference(present) }}"
  no_log: true

# Новый пароль restic к существующему репозиторию не подходит: каждый ночной бэкап падал бы,
# а старые копии остались бы без пароля. Строку restic_password удалили или стёрли — вернуть
# прежнюю (из менеджера паролей), а не создавать новую
- name: Есть ли уже репозиторий restic на сервере
  ansible.builtin.stat:
    path: "{{ restic_local_repo }}/config"
  register: restic_repo

- name: Пароль restic не создаётся заново, если репозиторий уже есть
  ansible.builtin.assert:
    that: "'restic_password' not in generated_secrets | default({}) or not restic_repo.stat.exists"
    fail_msg: >-
      В {{ infra_dir }}/secrets.yml нет restic_password (или он пустой), а репозиторий
      {{ restic_local_repo }} уже есть: новый пароль к нему не подойдёт. Впишите прежний пароль
      из менеджера паролей: restic_password: "..."
    quiet: true

# changed: это и есть изменение — так строку видно и в предпросмотре infra apply
- name: Какие пароли создаются
  ansible.builtin.debug:
    msg: "Новые пароли в {{ infra_dir }}/secrets.yml: {{ generated_secrets.keys() | join(', ') }}"
  when: generated_secrets | default({}) | length > 0
  changed_when: true

# В --check файл не меняется: новые пароли только показаны (в настоящем прогоне — другие).
# no_log: при ошибке Ansible напечатал бы элемент цикла целиком, с паролем
- name: Новые пароли записаны в secrets.yml
  ansible.builtin.lineinfile:
    path: "{{ infra_dir }}/secrets.yml"
    regexp: "^{{ item.key }}:"
    line: '{{ item.key }}: "{{ item.value }}"'
  loop: "{{ generated_secrets | default({}) | dict2items }}"
  no_log: true

- name: Создан пароль restic — сохраните его в менеджере паролей
  ansible.builtin.debug:
    msg: >-
      Новый пароль restic — в {{ infra_dir }}/secrets.yml (restic_password). Скопируйте его в менеджер
      паролей: без него при потере сервера бэкапы в S3 и у вас не расшифровать
  when: "'restic_password' in generated_secrets | default({})"
  changed_when: true

# Заготовки из образца — строки с пустым значением, которых нет в файле (сервер ставили до них
# или строку стёрли): дописать пустыми. diff: false — в diff lineinfile попал бы весь файл,
# с паролями; что дописано — видно по именам ключей в выводе
- name: В secrets.yml есть строки для ключей администратора (пустые — не используются)
  vars:
    blanks: "{{ lookup('ansible.builtin.file', role_path ~ '/../../secrets.yml.example').splitlines()
                | select('match', '^[a-z0-9_]+: \"\"') | list }}"
    have: "{{ secrets_file | default({}) | list }}"
  ansible.builtin.lineinfile:
    path: "{{ infra_dir }}/secrets.yml"
    line: "{{ item }}"
  loop: "{{ blanks | reject('match', '^(' ~ (have | join('|')) ~ '):') | list }}"
  loop_control:
    label: "{{ item | regex_replace(':.*$', '') }}"
  diff: false
