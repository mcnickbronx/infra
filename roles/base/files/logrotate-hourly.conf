# Управляется Ansible (роль base). logrotate — каждый час, а не раз в сутки: журналы с пределом
# размера (maxsize: access-лог Traefik, журнал событий) не успевают за сутки занять диск.
# Ротация по времени (daily, weekly, monthly) от этого не меняется.
[Timer]
OnCalendar=
OnCalendar=hourly
AccuracySec=1m
